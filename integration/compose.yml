services:
  ledger:
    image: mobiquant-wealthfolio:3.9.1-mq1
    build:
      context: .
      dockerfile: Dockerfile.runtime
    platform: linux/arm64
    container_name: mobiquant-wealthfolio
    restart: unless-stopped
    user: "${WF_RUNTIME_UID:?required}:${WF_RUNTIME_GID:?required}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    volumes:
      - /var/lib/mobiquant-wealthfolio:/data
    environment:
      WF_LISTEN_ADDR: "0.0.0.0:8088"
      WF_DB_PATH: "/data/wealthfolio.db"
      WF_DB_REQUIRE_ENCRYPTION: "1"
      WF_SECRET_KEY: "${WF_SECRET_KEY:?required}"
      WF_AUTH_PASSWORD_HASH: "${WF_AUTH_PASSWORD_HASH:?required}"
      WF_COOKIE_SECURE: "true"
      WF_AUTH_TOKEN_TTL_MINUTES: "60"
      WF_CORS_ALLOW_ORIGINS: "https://hetzner-cax11.tail6fee71.ts.net"
      WF_MCP_ENABLED: "false"
      WF_REQUEST_TIMEOUT_MS: "30000"
      RUST_LOG: "warn"
    networks:
      ledger-private:
        ipv4_address: 192.168.193.2
# Docker never publishes ports for a container that is only on an internal network.
# The fixed address is reached from the host by mobiquant-wealthfolio-proxy.socket,
# which listens on 127.0.0.1:8793; the container itself has no route out.
networks:
  ledger-private:
    internal: true
    ipam:
      config:
        - subnet: 192.168.193.0/29
