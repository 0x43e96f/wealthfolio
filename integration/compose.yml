services:
  ledger:
    image: wealthfolio/wealthfolio@sha256:426b35b77edabbdcf0638f93ef04077ec906894accef2a7fd82a21282d292c23
    platform: linux/arm64
    container_name: mobiquant-wealthfolio
    restart: unless-stopped
    ports:
      - "127.0.0.1:8793:8088"
    user: "1000:1000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    volumes:
      - /var/lib/mobiquant-wealthfolio:/data
    environment:
      WF_LISTEN_ADDR: "0.0.0.0:8088"
      WF_DB_PATH: "/data/wealthfolio.db"
      WF_DB_REQUIRE_ENCRYPTION: "1"
      WF_SECRET_KEY: "${WF_SECRET_KEY:?required}"
      WF_AUTH_PASSWORD_HASH: "${WF_AUTH_PASSWORD_HASH:?required}"
      WF_COOKIE_SECURE: "true"
      WF_AUTH_TOKEN_TTL_MINUTES: "60"
      WF_CORS_ALLOW_ORIGINS: "https://hetzner-cax11.tail6fee71.ts.net"
      WF_MCP_ENABLED: "false"
      WF_REQUEST_TIMEOUT_MS: "30000"
      RUST_LOG: "warn"
    networks:
      - ledger-private
networks:
  ledger-private:
    internal: true
